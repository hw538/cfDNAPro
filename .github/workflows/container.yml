name: Build and publish container

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: cfdnapro-container
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make room for reference genomes on the ephemeral runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^Version: //p' DESCRIPTION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the exact release source
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Run installed regression tests without network access
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker run --rm --network none \
            -v "$PWD/tools/container-test.R:/tmp/container-test.R:ro" \
            "$IMAGE:$VERSION" Rscript --vanilla /tmp/container-test.R "$VERSION"
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION" | tee container-push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' container-push.log | tail -1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Published cfDNAPro $VERSION after installed, offline regression tests."
            echo
            echo "Image: \`$IMAGE:$VERSION\`"
            echo "Digest: \`$IMAGE@$digest\`"
            echo "Source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
